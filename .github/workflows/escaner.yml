name: Escaner de consenso

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 4 * * 2"
    - cron: "7 4 * * 5"
    - cron: "7 12 * * 6"
  workflow_dispatch:
    inputs:
      comando:
        description: "escanear o cierres"
        required: true
        default: escanear

permissions:
  contents: write

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - name: Ejecutar
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then CMD="${{ github.event.inputs.comando }}";
          elif [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then CMD="cierres";
          else CMD="escanear"; fi
          echo "Comando: $CMD"
          python escaner.py "$CMD"
      - name: Guardar resultados
        run: |
          git config user.name "escaner-bot"
          git config user.email "escaner-bot@users.noreply.github.com"
          git add -A capturas *.csv *.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push; fi
